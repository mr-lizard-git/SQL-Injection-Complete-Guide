<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420"><rect width="1100" height="420" rx="20" fill="#f4f7fa"/><text x="40" y="52" font-family="Arial" font-size="28" font-weight="700" fill="#172b4d">Blind SQLi: infer from a controlled observable</text><g font-family="Arial"><rect x="55" y="120" width="260" height="104" rx="14" fill="#fff" stroke="#55728c" stroke-width="2"/><text x="185" y="162" text-anchor="middle" font-size="21" font-weight="700" fill="#172b4d">Condition in query</text><text x="185" y="194" text-anchor="middle" font-size="16" fill="#526579">true or false</text><path d="M315 172h95" stroke="#47657f" stroke-width="4"/><path d="m398 160 12 12-12 12" stroke="#47657f" stroke-width="4" fill="none"/><rect x="410" y="95" width="290" height="78" rx="12" fill="#e5f6f2" stroke="#36a68f" stroke-width="2"/><text x="555" y="128" text-anchor="middle" font-size="19" font-weight="700" fill="#176b5d">Boolean oracle</text><text x="555" y="153" text-anchor="middle" font-size="15" fill="#176b5d">stable response difference</text><rect x="410" y="208" width="290" height="78" rx="12" fill="#fff1e8" stroke="#de8155" stroke-width="2"/><text x="555" y="241" text-anchor="middle" font-size="19" font-weight="700" fill="#803b20">Timing oracle</text><text x="555" y="266" text-anchor="middle" font-size="15" fill="#803b20">repeatable conditional delay</text><path d="M700 134h80v40h45M700 247h80v-40h45" fill="none" stroke="#47657f" stroke-width="3"/><path d="m858 202 12 12-12 12" stroke="#47657f" stroke-width="4" fill="none"/><rect x="870" y="160" width="185" height="104" rx="14" fill="#fff" stroke="#55728c" stroke-width="2"/><text x="962" y="201" text-anchor="middle" font-size="20" font-weight="700" fill="#172b4d">Compare</text><text x="962" y="231" text-anchor="middle" font-size="16" fill="#526579">matched controls</text><text x="55" y="345" font-size="16" fill="#526579">Repeat low-impact lab requests. Noise, caching, state, and server load can mimic a signal.</text><text x="55" y="375" font-size="16" fill="#526579">Stop at minimal proof; inference is not direct query-result visibility.</text></g></svg>
